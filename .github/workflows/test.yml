# Runs on every pull request, with no path filter: branch protection on `main` requires this
# check, so a docs-only PR must run it too or it would wait forever.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # oxlint through its ratchet (frontend/lint-baseline.json: a new hit or a stale entry
      # fails), then ESLint. Unused variables, broken hook calls, thrown non-Errors.
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # A broken import or bad JSX fails the build long before any test covers it.
      - run: npm run build
        working-directory: frontend
      # The fatigue model must never read higher after a rest day than before it.
      # Property probe over ~108k comparisons; too slow for the unit suite, cheap here.
      - run: npm run test:fatigue-probe
        working-directory: frontend
      - name: React Doctor
        run: node scripts/check-react-doctor-floor.mjs
        working-directory: frontend
