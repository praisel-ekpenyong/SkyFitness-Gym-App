# Runs on every pull request, with no path filter: branch protection on `main` requires this
# check, so a docs-only PR must run it too or it would wait forever.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: TZ=Pacific/Kiritimati npx vitest run src/lib/stats-selectors.test.js
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:fatigue-probe
        working-directory: frontend
      - name: React Doctor
        run: node scripts/check-react-doctor-floor.mjs
        working-directory: frontend
