name: Bug report
description: Something in Sky is broken or not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What did you do?
      description: Steps to reproduce, as precisely as you can.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include error messages, console output, or screenshots if you have them.
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: How are you running Sky?
      options:
        - Installed PWA (Home screen)
        - Mobile browser (Safari / Chrome)
        - Desktop browser
        - Capacitor native app
        - Local dev server (npm run dev)
        - Other / not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser & OS
      placeholder: e.g. Safari 18 on iOS 18, Chrome 126 on Android, macOS Safari
    validations:
      required: true

