#   - gradle (frontend/android) and cocoapods (frontend/ios) — Capacitor generates those shells
#     and pins the native versions to the @capacitor/* npm packages. Bumping them independently
#     desyncs the two and breaks the mobile build; they follow the npm update instead.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend:
        patterns: ['*']
        update-types: ['minor', 'patch']
      frontend-major:
        patterns: ['*']
        update-types: ['major']
    ignore:
      # Capacitor 8 needs Node >= 22 (its own `engines` field) and the build host is on 20, and
      # `frontend/android` + `frontend/ios` are committed, so a major also means migrating the
      # native projects — Gradle/AGP, the Podfile. That is a deliberate piece of work, not a
      # dependency bump. Drop this ignore once the build host is on Node 22 and you want it.
      - dependency-name: '@capacitor/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
      actions-major:
        patterns: ['*']
        update-types: ['major']
