#   - gradle (frontend/android) and cocoapods (frontend/ios) — Capacitor generates those shells
#     and pins the native versions to the @capacitor/* npm packages. Bumping them independently
#     desyncs the two and breaks the mobile build; they follow the npm update instead.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend:
        patterns: ['*']
        update-types: ['minor', 'patch']
      frontend-major:
        patterns: ['*']
        update-types: ['major']
    ignore:
      # The committed native projects (frontend/android, frontend/ios) pin Gradle/AGP and the
      # Podfile to the @capacitor/* versions, so a major means migrating both native projects.
      # That is a deliberate piece of work, not a dependency bump. Drop this ignore once that
      # migration is done.
      - dependency-name: '@capacitor/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
      actions-major:
        patterns: ['*']
        update-types: ['major']
